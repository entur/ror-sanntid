<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fant ikke siden – Sanntid</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🚌</text></svg>"
    />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1a1c1f;
        --muted: #5b6470;
        --accent: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --fg: #e8eaed;
          --muted: #9aa3af;
          --accent: #7ea2ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .wrap {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 2.75rem);
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
      }
      a + a {
        margin-left: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>404</h1>
      <p>Fant ikke siden. <span lang="en">Page not found.</span></p>
      <a href="/">Til forsiden</a>
      <a href="/en/" lang="en" hreflang="en">Front page</a>
    </div>
  </body>
</html>
